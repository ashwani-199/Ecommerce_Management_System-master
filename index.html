<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flipkart Style Zoom with Thumbnails</title>
  <style>
    .gallery {
      display: flex;
      gap: 10px;
    }
    .img-container {
      position: relative;
      width: 400px;
    }
    .main-img {
      width: 100%;
      display: block;
    }
    .zoom-lens {
      position: absolute;
      border: 2px solid #000;
      width: 100px;
      height: 100px;
      opacity: 0.4;
      background-color: #fff;
      cursor: crosshair;
      display: none;
    }
    .zoom-result {
      border: 1px solid #d4d4d4;
      width: 400px;
      height: 400px;
      overflow: hidden;
      position: absolute;
      top: 0;
      left: 420px;
      display: none;
    }
    .zoom-result img {
      position: absolute;
    }
    .thumbnails {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }
    .thumbnails img {
      width: 80px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .thumbnails img.active {
      border-color: #000;
    }
  </style>
</head>
<body>

<div class="gallery">
  <div class="img-container" id="img-container">
    <img src="static/fronts/images/banner-01.jpg" alt="Product" class="main-img" id="main-img">
    <div class="zoom-lens" id="zoom-lens"></div>
  </div>
  <div class="zoom-result" id="zoom-result">
    <img src="static/fronts/images/banner-01.jpg" id="zoomed-img">
  </div>
</div>

<div class="thumbnails">
  <img src="static/fronts/images/banner-01.jpg" class="active" onclick="changeImage(this)">
  <img src="static/fronts/images/banner-02.jpg" onclick="changeImage(this)">
  <img src="static/fronts/images/banner-03.jpg" onclick="changeImage(this)">
</div>

<script>
  const img = document.getElementById("main-img");
  const lens = document.getElementById("zoom-lens");
  const result = document.getElementById("zoom-result");
  const zoomedImg = document.getElementById("zoomed-img");

  let cx, cy;

  function initZoom() {
    cx = result.offsetWidth / lens.offsetWidth;
    cy = result.offsetHeight / lens.offsetHeight;
    zoomedImg.style.width = img.width * cx + "px";
    zoomedImg.style.height = img.height * cy + "px";
  }

  function moveLens(e) {
    const pos = getCursorPos(e);
    let x = pos.x - lens.offsetWidth / 2;
    let y = pos.y - lens.offsetHeight / 2;

    x = Math.max(0, Math.min(x, img.width - lens.offsetWidth));
    y = Math.max(0, Math.min(y, img.height - lens.offsetHeight));

    lens.style.left = x + "px";
    lens.style.top = y + "px";

    zoomedImg.style.left = -x * cx + "px";
    zoomedImg.style.top = -y * cy + "px";
  }

  function getCursorPos(e) {
    const rect = img.getBoundingClientRect();
    return {
      x: e.pageX - rect.left - window.pageXOffset,
      y: e.pageY - rect.top - window.pageYOffset
    };
  }

  img.addEventListener("mousemove", moveLens);
  lens.addEventListener("mousemove", moveLens);
  img.addEventListener("mouseenter", () => {
    lens.style.display = "block";
    result.style.display = "block";
    initZoom();
  });
  img.addEventListener("mouseleave", () => {
    lens.style.display = "none";
    result.style.display = "none";
  });

  function changeImage(thumbnail) {
    document.querySelectorAll(".thumbnails img").forEach(t => t.classList.remove("active"));
    thumbnail.classList.add("active");
    img.src = thumbnail.src;
    zoomedImg.src = thumbnail.src;
    initZoom();
  }

  initZoom();
</script>

</body>
</html>
